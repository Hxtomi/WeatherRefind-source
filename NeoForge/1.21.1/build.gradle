plugins {
    id 'net.neoforged.moddev' version '2.0.147'
}

version = '2.0'
group = 'dev.norevy.weatherrefind'

base {
    archivesName = 'weatherrefind'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    enable {
        version = '21.1.169'
        disableRecompilation = true
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        weatherrefind {
            sourceSet sourceSets.main
        }
    }
}

repositories {
}

dependencies {
}

jar {
    manifest {
        attributes([
            'Specification-Title'    : 'WeatherRefind',
            'Specification-Vendor'   : 'Norevy',
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : 'Norevy',
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.main.java.srcDir "../../common/src/main/java"
jar { archiveFileName = "WeatherRefind-neoforge-1.21.1-v${project.version}.jar" }

jar { from("../../LICENSE") { rename { "LICENSE" } } }
tasks.matching { it.name == "sourcesJar" }.configureEach { from("../../LICENSE") { rename { "LICENSE" } } }
